name: Fetch Alexela 95 price

on:
  schedule:
    - cron: "17 * * * *"   # hourly (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python petrol_tracker.py fetch
      - run: python petrol_tracker.py report
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Update Alexela 95 price"
          git push
